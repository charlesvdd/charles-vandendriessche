name: Deploy Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "::error::Secrets manquants: DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_APPLICATION_ID"
            echo "Dans Dokploy: Profile → API Token, puis Application → copier l'ID."
            echo "DOKPLOY_URL exemple: http://163.172.140.240:3000"
            exit 1
          fi
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -d "{\"applicationId\": \"${DOKPLOY_APPLICATION_ID}\"}"
          echo
          echo "Deploy Dokploy déclenché."
